[versions]
agp = "9.2.1"
kotlin = "2.2.10"
compose-bom = "2026.06.00"
activity-compose = "1.13.0"
junit4 = "4.13.2"
wire-contract = "0.1.0"
room = "2.8.4"
sqlite = "2.6.2"
ksp = "2.3.9"
androidx-test-core = "1.7.0"
uiautomator = "2.4.0"
robolectric = "4.16.1"
okhttp = "5.4.0"
datastore = "1.2.1"
coroutines = "1.10.2"
navigation3 = "1.1.4"
lifecycle = "2.11.0"
serialization = "1.9.0"
androidx-core = "1.19.0"
quickjs-kt = "1.0.5"
markdown-renderer = "0.38.1"
exifinterface = "1.4.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
wire-contract = { module = "app.momoding:wire-kotlin-contract", version.ref = "wire-contract" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
