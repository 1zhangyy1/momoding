# Momoding share relay. Deploy with scripts/deploy-share-relay.sh (it asks for everything it needs).
name = "momoding-share-relay"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [{ pattern = "share.momoding.com", zone_name = "momoding.com", custom_domain = true }]

[vars]
# (no GitHub token here: pull requests are opened by scripts/review-shares.sh)

# The KV namespace for per-day limits; the deploy script creates it and fills in the id.
[[kv_namespaces]]
binding = "LIMITS"
id = "5ada7ee605554ec8b342e8cbc78c6bb4"

