name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: Public boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: mobile-runtime-js/.nvmrc
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Check public repository
        run: ./scripts/check-public-repo.sh

  runtime:
    name: Pi runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: mobile-runtime-js/.nvmrc
          cache: npm
          cache-dependency-path: mobile-runtime-js/package-lock.json
      - name: Verify npm version
        run: test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --prefix mobile-runtime-js
      - name: Check runtime
        run: npm run check --prefix mobile-runtime-js

  kotlin-contract:
    name: Kotlin wire contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test wire contract
        run: ./wire/kotlin-contract/gradlew -p wire/kotlin-contract --no-daemon test

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: mobile-runtime-js/.nvmrc
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-37"
          "build-tools;37.0.0"
          "ndk;28.2.13676358"
      - name: Test, lint, and assemble
        run: >-
          SOURCE_REVISION="$(node -p
          "JSON.parse(require('node:fs').readFileSync('.public-source.json',
          'utf8')).sourceRevision")"
          ./android-app/gradlew -p android-app --no-daemon
          testDebugUnitTest compileDebugAndroidTestKotlin
          lintDebug assembleDebug assembleRelease
      - name: Inspect release APK
        run: node ./scripts/verify-release-apk.mjs
