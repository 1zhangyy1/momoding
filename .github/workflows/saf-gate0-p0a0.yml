name: SAF Gate 0 P0A-0

on:
  push:
    paths:
      - ".github/workflows/saf-gate0-p0a0.yml"
      - "experiments/saf-gate0/**"
  pull_request:
    paths:
      - ".github/workflows/saf-gate0-p0a0.yml"
      - "experiments/saf-gate0/**"

permissions:
  contents: read

jobs:
  p0a0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install locked Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"
      - name: Run P0A-0 required gate
        working-directory: experiments/saf-gate0
        run: ./scripts/check-p0a0.sh
